services:
  db:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: flooddb
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flooddb"]
      interval: 5s
      timeout: 5s
      retries: 10

  db_test:
    image: postgis/postgis:15-3.4
    environment:
      POSTGRES_DB: flooddb_test
      POSTGRES_USER: flood
      POSTGRES_PASSWORD: flood
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flood -d flooddb_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
